  - name: Check required secrets
    run: |
      missing=0
      for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
        if [ -z "${!v}" ]; then
          echo "ERROR: Required secret $v is not set."
          missing=1
        fi
      done
      if [ "$missing" -eq 1 ]; then
        echo "One or more required secrets are missing. Please add them in Settings → Secrets and variables → Actions."
        exit 1
      fi

  - uses: supabase/setup-cli@v1
    with:
      version: latest

  - name: Link Supabase project
    run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

  - name: Set function secrets
    run: supabase secrets set GROQ_API_KEY="$GROQ_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

  - name: Deploy frank-chat function
    run: supabase functions deploy frank-chat --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
