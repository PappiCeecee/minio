<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frank-AI | ROASOD Automations </title>
<style>
  :root {
    --bg: #f4f7fb;
    --panel: #ffffff;
    --accent: #0072ff;
    --accent-2: #00c6ff;
    --text: #1a2233;
    --muted: #6b7688;
    --bubble-user: #0072ff;
    --bubble-ai: #eef2f9;
    --border: #e3e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .orb {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    box-shadow: 0 0 16px rgba(0, 114, 255, 0.5);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 16px rgba(0,114,255,.5); }
    50% { transform: scale(1.12); box-shadow: 0 0 26px rgba(0,114,255,.75); }
  }
  header h1 {
    font-size: 18px;
    letter-spacing: 2px;
    margin: 0;
    font-weight: 700;
  }
  header .tag {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  main {
    width: 100%;
    max-width: 720px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px 2px 16px;
    min-height: 60vh;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.ai.typing { color: var(--muted); font-style: italic; }
  #composer {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    position: sticky;
    bottom: 12px;
  }
  #input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    padding: 8px 6px;
    background: transparent;
    color: var(--text);
  }
  #send {
    border: none;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  #send:disabled { opacity: .5; cursor: default; }
  footer {
    padding: 10px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <header>
    <div class="orb"></div>
    <div>
      <h1>FRANK</h1>
      <div class="tag">AI Assistant · ROASOD</div>
    </div>
  </header>

  <main>
    <div id="chat">
      <div class="msg ai">Hey, I'm Frank — the AI assistant built by ROASOD. What can I help you with?</div>
    </div>
    <div id="composer">
      <input id="input" type="text" placeholder="Message Frank..." autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </main>

  <footer>Frank AI · Built under ROASOD by Tshabalala Raycee</footer>

  <script>
    // ---- CONFIG ----
    // Replace with your deployed Supabase Edge Function URL, e.g.:
    // https://YOUR-PROJECT-REF.supabase.co/functions/v1/frank-chat
    const FRANK_ENDPOINT = "https://ndzwlxffsyqhnmxjwnkr.supabase.co/functions/v1/frank-chat";
    // If you set verify_jwt = true in config.toml, put your Supabase anon key here.
    const SUPABASE_ANON_KEY = ""; // optional

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    let history = [];

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendBtn.disabled = true;

      addMessage(text, "user");
      const typingEl = addMessage("Frank is typing...", "ai typing");

      try {
        const headers = { "Content-Type": "application/json" };
        if (SUPABASE_ANON_KEY) headers["Authorization"] = "Bearer " + SUPABASE_ANON_KEY;

        const res = await fetch(FRANK_ENDPOINT, {
          method: "POST",
          headers,
          body: JSON.stringify({ message: text, history }),
        });
        const data = await res.json();
        typingEl.remove();

        if (!res.ok) {
          addMessage("Sorry, sir — something went wrong: " + (data.error || res.status), "ai");
          return;
        }

        addMessage(data.reply, "ai");
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: data.reply });
        history = history.slice(-8);
      } catch (err) {
        typingEl.remove();
        addMessage("I couldn't reach the server. Check your connection and try again.", "ai");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
